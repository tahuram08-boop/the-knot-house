<body>

<header>
    <div class="navbar">
        <a href="index.html" class="logo">
            <img src="logo.png" alt="The Knot House Logo">
            <span>The Knot House</span>
        </a>

        <nav class="nav-links" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="login.php">Login</a>
        </nav>
    </div>
</header>

<main>
    <section class="register-card">
        <div class="heading">
            <div class="icon">🧶</div>
            <h1>Create Account</h1>
            <p>Join The Knot House and discover the beauty of handmade crochet.</p>
        </div>

        <form id="registerForm" action="register.php" method="POST" autocomplete="on">

            <div class="form-group">
                <label for="full_name">Full Name</label>
                <input
                    type="text"
                    id="full_name"
                    name="full_name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    minlength="2"
                    maxlength="100"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    maxlength="150"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Phone Number (Optional)</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    autocomplete="tel"
                    maxlength="20"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >
                <p class="hint">Your password must contain at least 8 characters.</p>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Enter your password again"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >
            </div>

            <div class="terms">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">
                    I agree to the terms and conditions and confirm that the information provided is correct.
                </label>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                Create My Account
            </button>

            <p class="login-text">
                Already have an account?
                <a href="login.php">Login here</a>
            </p>

        </form>
    </section>
</main>

<footer>
    © 2026 The Knot House. Handmade with love 🩷
</footer>

<script>
    const registerForm = document.getElementById("registerForm");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirm_password");
    const submitBtn = document.getElementById("submitBtn");

    registerForm.addEventListener("submit", function (event) {
        if (password.value.length < 8) {
            event.preventDefault();
            alert("Password must contain at least 8 characters.");
            password.focus();
            return;
        }

        if (password.value !== confirmPassword.value) {
            event.preventDefault();
            alert("Passwords do not match. Please enter the same password.");
            confirmPassword.focus();
            return;
        }

        if (!document.getElementById("terms").checked) {
            event.preventDefault();
            alert("Please accept the terms and conditions.");
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Creating Account...";
    });
</script>

</body>
</html>
